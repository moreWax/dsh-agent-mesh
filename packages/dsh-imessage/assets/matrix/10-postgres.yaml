apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: matrix
type: Opaque
stringData:
  POSTGRES_PASSWORD: REPLACE_ME_BEFORE_APPLY
  POSTGRES_USER: synapse
  POSTGRES_DB: synapse
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: matrix
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: matrix
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        envFrom: [{ secretRef: { name: postgres-secret } }]
        ports: [{ containerPort: 5432 }]
        volumeMounts:
        - { name: data, mountPath: /var/lib/postgresql/data }
        readinessProbe:
          exec: { command: ["pg_isready", "-U", "synapse"] }
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim: { claimName: postgres-data }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: matrix
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
