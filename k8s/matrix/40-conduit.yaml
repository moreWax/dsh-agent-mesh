apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: conduit-data
  namespace: matrix
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conduit
  namespace: matrix
spec:
  replicas: 1
  selector:
    matchLabels: { app: conduit }
  template:
    metadata:
      labels: { app: conduit }
    spec:
      containers:
      - name: conduit
        image: matrixconduit/matrix-conduit:latest
        ports: [{ containerPort: 6167 }]
        env:
        - { name: CONDUIT_SERVER_NAME, value: dsh-imessage.local }
        - { name: CONDUIT_PORT, value: "6167" }
        - { name: CONDUIT_CONFIG, value: "" }
        volumeMounts:
        - { name: data, mountPath: /var/lib/matrix-conduit }
---
apiVersion: v1
kind: Service
metadata:
  name: conduit
  namespace: matrix
spec:
  selector: { app: conduit }
  ports: [{ port: 6167 }]
