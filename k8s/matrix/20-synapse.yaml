apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: synapse-data
  namespace: matrix
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 8Gi
---
# One-shot generator: creates homeserver.yaml + keys inside the shared PVC.
apiVersion: batch/v1
kind: Job
metadata:
  name: synapse-generate
  namespace: matrix
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: generate
        image: matrixdotorg/synapse:v1.120.0
        args: ["generate"]
        env:
        - { name: SYNAPSE_SERVER_NAME, value: matrix.escha.lan }
        - { name: SYNAPSE_REPORT_STATS, value: "no" }
        volumeMounts:
        - { name: data, mountPath: /data }
      volumes:
      - name: data
        persistentVolumeClaim: { claimName: synapse-data }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: synapse-patch
  namespace: matrix
data:
  overrides.yaml: |
    database:
      name: psycopg2
      args:
        host: postgres
        user: synapse
        password: REPLACE_ME_BEFORE_APPLY
        database: synapse
    cp_min: 5
    cp_max: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse
  namespace: matrix
spec:
  replicas: 1
  selector:
    matchLabels: { app: synapse }
  template:
    metadata:
      labels: { app: synapse }
    spec:
      containers:
      - name: synapse
        image: matrixdotorg/synapse:v1.120.0
        ports: [{ containerPort: 8008 }]
        volumeMounts:
        - { name: data, mountPath: /data }
        - { name: overrides, mountPath: /conf-extra }
        command: ["python", "-m", "synapse.app.homeserver",
                  "--config-path", "/data/homeserver.yaml",
                  "--config-path", "/conf-extra/overrides.yaml"]
        readinessProbe:
          httpGet: { path: /health, port: 8008 }
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim: { claimName: synapse-data }
      - name: overrides
        configMap: { name: synapse-patch }
---
apiVersion: v1
kind: Service
metadata:
  name: synapse
  namespace: matrix
spec:
  selector: { app: synapse }
  ports: [{ port: 8008 }]
