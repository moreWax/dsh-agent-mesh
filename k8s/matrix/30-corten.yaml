apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: corten-data
  namespace: matrix
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: corten-matrix
  namespace: matrix
spec:
  replicas: 1
  selector:
    matchLabels: { app: corten-matrix }
  template:
    metadata:
      labels: { app: corten-matrix }
    spec:
      containers:
      - name: corten
        image: ghcr.io/lrhodin/corten-matrix-linux-amd64:latest
        ports: [{ containerPort: 29319 }]
        volumeMounts:
        - { name: data, mountPath: /data }
      volumes:
      - name: data
        persistentVolumeClaim: { claimName: corten-data }
