name: publish
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'   # fetch:binaries BUILDS sam-node from the pinned commit
      - run: pnpm install --frozen-lockfile
      - run: pnpm run -r typecheck
      - run: pnpm run -r test
      - run: pnpm run -r build
      # Vendor the checksum-verified sam-node binaries into the platform
      # packages BEFORE publish (bin/ is gitignored; the npm tarball carries
      # them so users never download anything at install time).
      - run: node scripts/fetch-sam-binaries.mjs
      - run: node scripts/fetch-llama-binaries.mjs
      # pnpm publishes in dependency order (platform packages + sam-mesh
      # before dsh-agent-mesh) and rewrites workspace:* at pack time.
      - run: pnpm -r publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
