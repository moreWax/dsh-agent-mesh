# SAM-native mesh capability. Initial bundle mounts the core integration;
# The LLM adapter is a separate Cordis plugin so the core capability service remains optional.
- insert:
    - id: agent-mesh
      name: '@morewax/dsh-agent-mesh'
      config:
        socketPath: ~/.config/sam-mesh/sam.sock
        tcpUrl: http://127.0.0.1:8080
        preferSocket: true
        nodeCredentialRef: SAM_NODE_AUTH

- insert:
    - id: agent-mesh-llm
      name: '@morewax/dsh-agent-mesh/llm'
      config:
        socketPath: ~/.config/sam-mesh/sam.sock
        tcpUrl: http://127.0.0.1:8080
        preferSocket: true
        nodeCredentialRef: SAM_NODE_AUTH
        route:
          mode: auto
        requiredLabelsAnyOf: []
        modelsTtlMs: 30000
        timeoutMs: 30000

- insert:
    - id: agent-mesh-tools
      name: '@morewax/dsh-agent-mesh/providers/tools'
      config:
        requiredLabelsAnyOf: []
        refreshIntervalMs: 60000
        failOnStartupError: false

# Optional deployable durable task MCP endpoint.
- insert:
    - id: agent-mesh-task-service
      name: '@morewax/dsh-agent-mesh/tasks/service'
      config:
        host: 127.0.0.1
        port: 0
        path: /mcp
        healthPath: /healthz
        serviceName: dsh-task-service
        registerWithSam: true
